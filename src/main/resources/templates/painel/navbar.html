<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="painel_navbar">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <nav>
        <div class="nav-left">
            <a th:href="@{/}" class="nav-logo">nemesis</a>
            <div class="nav-breadcrumb">
                <span class="sep">/</span>
                <a th:href="@{/panelProdutos}">Painel</a>
                <span class="sep">/</span>
                <span class="current" th:if="${paginaAtiva == 'addProdutos'}">Novo produto</span>
                <span class="current" th:if="${paginaAtiva == 'listarProdutos'}">Todos os produtos</span>
                <span class="current" th:if="${paginaAtiva == 'categorias'}">Categorias</span>
                <span class="current" th:if="${paginaAtiva == 'pedidos'}">Todos os Pedidos</span>
                <span class="current" th:if="${paginaAtiva == 'listarUsuarios'}">Todos os Usuários</span>
            </div>
        </div>

        <div class="nav-right">
            <span th:if="${session.usuarioLogado.nome != null}"
                  class="nav-user"
                  th:text="${session.usuarioLogado.nome}">Usuário</span>

            <span th:if="${session.usuarioLogado.tipo.ordinal() == 0}" class="role-badge admin">Admin</span>
            <span th:if="${session.usuarioLogado.tipo.ordinal() == 2}" class="role-badge func">Funcionário</span>

            <button class="theme-btn" id="theme-btn" title="Alternar tema" aria-label="Alternar tema">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>

            <button class="panel-hamburger" id="panel-hamburger" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Sair</button>
            </form>
        </div>
    </nav>

    <div class="panel-mobile-drawer" id="panel-mobile-drawer">

        <a th:href="@{/painel/produtos}"
           class="panel-mobile-link"
           th:classappend="${paginaAtiva == 'listarProdutos'} ? ' active' : ''">
            <i class="fa-solid fa-box"></i>
            Produtos
        </a>

        <a th:href="@{/painel/produtos/novo}"
           class="panel-mobile-link"
           th:classappend="${paginaAtiva == 'addProdutos'} ? ' active' : ''">
            <i class="fa-solid fa-plus"></i>
            Novo produto
        </a>

        <a th:href="@{/painel/pedidos}"
           class="panel-mobile-link"
           th:classappend="${paginaAtiva == 'pedidos'} ? ' active' : ''">
            <i class="fa-solid fa-receipt"></i>
            Pedidos
        </a>

        <a th:href="@{/painel/categorias}"
           class="panel-mobile-link"
           th:classappend="${paginaAtiva == 'categorias'} ? ' active' : ''">
            <i class="fa-solid fa-tags"></i>
            Categorias
        </a>

        <a th:if="${session.usuarioLogado.tipo.ordinal() == 0}"
           th:href="@{/painel/usuarios}"
           class="panel-mobile-link"
           th:classappend="${paginaAtiva == 'listarUsuarios'} ? ' active' : ''">
            <i class="fa-solid fa-users"></i>
            Usuários
        </a>

        <div class="panel-mobile-actions">
            <a th:href="@{/perfil}" class="panel-mobile-action">
                <i class="fa-solid fa-user"></i>
                Meu perfil
            </a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="panel-mobile-action">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Sair
                </button>
            </form>
        </div>

    </div>

    <script>
        (function () {
            function syncIcon(theme) {
                var icon = document.getElementById('theme-icon');
                if (!icon) return;
                icon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }

            var current = localStorage.getItem('nemesis_theme') || 'dark';
            syncIcon(current);

            var btn = document.getElementById('theme-btn');

            if (btn) {
                btn.addEventListener('click', function () {
                    var html = document.documentElement;
                    var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';

                    html.setAttribute('data-theme', next);
                    localStorage.setItem('nemesis_theme', next);
                    syncIcon(next);
                });
            }

            var hbg = document.getElementById('panel-hamburger');
            var drawer = document.getElementById('panel-mobile-drawer');

            if (hbg && drawer) {
                hbg.addEventListener('click', function () {
                    var open = drawer.classList.toggle('open');
                    hbg.classList.toggle('open', open);
                    document.body.style.overflow = open ? 'hidden' : '';
                });
            }
        })();
    </script>
</div>
</body>
</html>
